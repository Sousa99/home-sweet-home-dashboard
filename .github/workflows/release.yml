name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"
      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sousa99/home-sweet-home-dashboard:${{ steps.version.outputs.version }}
            ghcr.io/sousa99/home-sweet-home-dashboard:latest
          secrets: |
            npm_token=${{ secrets.GH_PACKAGES_TOKEN }}
