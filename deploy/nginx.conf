server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Module API reverse proxies. The published widgets receive a per-module
    # baseUrl (/api/bus, /api/tasks, /api/fly) and build requests like
    # /api/<module>/api/...; the /api/<module> prefix is stripped here and the
    # remainder is forwarded to that module's backend (which routes under /api).
    # Mirrored by the dev proxy in vite.config.ts.
    location /api/bus/ {
        rewrite ^/api/bus(/.*)$ $1 break;
        proxy_pass http://bus-catcher-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tasks/ {
        rewrite ^/api/tasks(/.*)$ $1 break;
        proxy_pass http://procrastinator-tracker-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/fly/ {
        rewrite ^/api/fly(/.*)$ $1 break;
        proxy_pass http://fly-over-tracker-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}