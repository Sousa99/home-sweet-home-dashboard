server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Resolving the compose service names at
    # request time (via the variables below) keeps the proxies pointed at the
    # current container IPs — nginx otherwise resolves upstream hostnames once
    # at startup and keeps stale IPs after `docker compose up` recreates a
    # backend, which surfaces as 404/502s with no data on the dashboard.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Module API reverse proxies. The published widgets receive a per-module
    # baseUrl (/api/bus, /api/tasks, /api/fly, /api/weather) and build requests
    # like /api/<module>/api/...; the /api/<module> prefix is stripped here and
    # the remainder is forwarded to that module's backend (which routes under
    # /api). Mirrored by the dev proxy in vite.config.ts.
    location /api/bus/ {
        set $bus_upstream http://bus-catcher-backend:3000;
        rewrite ^/api/bus(/.*)$ $1 break;
        proxy_pass $bus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tasks/ {
        set $tasks_upstream http://procrastinator-tracker-backend:3000;
        rewrite ^/api/tasks(/.*)$ $1 break;
        proxy_pass $tasks_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/fly/ {
        set $fly_upstream http://fly-over-tracker-backend:3000;
        rewrite ^/api/fly(/.*)$ $1 break;
        proxy_pass $fly_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/weather/ {
        set $weather_upstream http://weather-psychic-backend:3000;
        rewrite ^/api/weather(/.*)$ $1 break;
        proxy_pass $weather_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
