name: home-sweet-home-dashboard

# Home Sweet Home — TV dashboard.
# Launches the three module backends from their published GHCR images plus the
# dashboard (nginx SPA + reverse proxy). Module databases live in ./data.
# Dev: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d`
#       then `pnpm dev` (Vite proxies to the exposed host ports).

services:
  bus-catcher-backend:
    image: ghcr.io/sousa99/bus-catcher-backend:${HSH_BUS_CATCHER_BACKEND_VERSION:-0.1.0}
    platform: ${HSH_BACKEND_PLATFORM:-linux/amd64}
    command: ['node', 'dist/index.js', '--http']
    environment:
      PORT: '3000'
      MCP_PORT: '3001'
      DB_PATH: /data/bus-catcher.db
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  fly-over-tracker-backend:
    image: ghcr.io/sousa99/fly-over-tracker-backend:${HSH_FLY_OVER_TRACKER_BACKEND_VERSION:-0.2.0}
    platform: ${HSH_BACKEND_PLATFORM:-linux/amd64}
    command: ['node', 'dist/index.js', '--http']
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      MCP_PORT: '3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3000,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  procrastinator-tracker-backend:
    image: ghcr.io/sousa99/procrastinator-tracker-backend:${HSH_PROCRASTINATOR_TRACKER_BACKEND_VERSION:-0.1.0}
    platform: ${HSH_BACKEND_PLATFORM:-linux/amd64}
    command: ['sh', '-c', 'node dist/migrate.js && node dist/index.js --http']
    environment:
      PORT: '3000'
      MCP_PORT: '3001'
      DATABASE_URL: /data/procrastinator.db
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # MCP servers (streamable HTTP at /mcp) — the same backend images in --mcp
  # mode. opencode.json connects to these via the host ports 3200/3201/3202.
  bus-catcher-mcp:
    image: ghcr.io/sousa99/bus-catcher-backend:${HSH_BUS_CATCHER_BACKEND_VERSION:-0.1.0}
    platform: ${HSH_BACKEND_PLATFORM:-linux/amd64}
    command: ['node', 'dist/index.js', '--mcp']
    environment:
      PORT: '3000'
      MCP_PORT: '3001'
      DB_PATH: /data/bus-catcher.db
    volumes:
      - ./data:/data
    ports:
      - '${HSH_BUS_CATCHER_MCP_PORT:-3200}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3001,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  fly-over-tracker-mcp:
    image: ghcr.io/sousa99/fly-over-tracker-backend:${HSH_FLY_OVER_TRACKER_BACKEND_VERSION:-0.2.0}
    platform: ${HSH_BACKEND_PLATFORM:-linux/amd64}
    command: ['node', 'dist/index.js', '--mcp']
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      MCP_PORT: '3001'
    ports:
      - '${HSH_FLY_OVER_TRACKER_MCP_PORT:-3201}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3001,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  procrastinator-tracker-mcp:
    image: ghcr.io/sousa99/procrastinator-tracker-backend:${HSH_PROCRASTINATOR_TRACKER_BACKEND_VERSION:-0.1.0}
    platform: ${HSH_BACKEND_PLATFORM:-linux/amd64}
    command: ['sh', '-c', 'node dist/migrate.js && node dist/index.js --mcp']
    environment:
      PORT: '3000'
      MCP_PORT: '3001'
      DATABASE_URL: /data/procrastinator.db
    volumes:
      - ./data:/data
    ports:
      - '${HSH_PROCRASTINATOR_TRACKER_MCP_PORT:-3202}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3001,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      secrets:
        - npm_token
    ports:
      - '${HSH_DASHBOARD_PORT:-3304}:80'
    volumes:
      - ./public/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      bus-catcher-backend:
        condition: service_healthy
      fly-over-tracker-backend:
        condition: service_healthy
      procrastinator-tracker-backend:
        condition: service_healthy
    restart: unless-stopped

secrets:
  npm_token:
    environment: GH_PACKAGES_TOKEN
